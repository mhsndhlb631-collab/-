name: Production availability
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run monitor:production -- --evidence
      - name: Preserve sanitized Pilot evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-monitor-${{ github.run_id }}
          path: output/p8/monitoring.json
          if-no-files-found: error
          retention-days: 30
