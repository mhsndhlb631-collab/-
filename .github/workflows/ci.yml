name: Educational operations
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke
  # Real Supabase and hosted acceptance remain separate mandatory stage gates.
