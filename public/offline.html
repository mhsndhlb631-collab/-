<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f4f46" />
    <title>مِنهاج — دون اتصال</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(20px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(20px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
        background: #0a1715;
        color: #f7faf9;
      }
      main {
        width: min(100%, 420px);
        padding: 28px;
        border: 1px solid #315d56;
        border-radius: 24px;
        background: #12231f;
        text-align: center;
        box-shadow: 0 24px 70px #0005;
      }
      img {
        width: 88px;
        height: 88px;
        border-radius: 22px;
      }
      h1 {
        margin: 18px 0 8px;
        font-size: 26px;
      }
      p {
        margin: 0 0 22px;
        color: #c4d4d0;
        line-height: 1.8;
      }
      a {
        display: block;
        min-height: 48px;
        padding: 12px 18px;
        border-radius: 14px;
        background: #d4a953;
        color: #17201e;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>مِنهاج محفوظ على جهازك</h1>
      <p>
        تعذر فتح واجهة العمل المحفوظة. أعد المحاولة، وستعود المزامنة تلقائيًا
        عند توفر الاتصال.
      </p>
      <a href="/">إعادة فتح مِنهاج</a>
    </main>
  </body>
</html>
